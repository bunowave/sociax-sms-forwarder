name: Build Full Sociax SMS Forwarder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" ! -name "node_modules.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -x "package.json" "package-lock.json" "*/package.json" "*/package-lock.json"
            rm -rf .aistudio
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix dependencies, install & build web app
        run: |
          test -f package.json
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.devDependencies = p.devDependencies || {}; if (p.dependencies) delete p.dependencies.esbuild; p.devDependencies.esbuild = "^0.28.2"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
          rm -f package-lock.json
          rm -rf node_modules
          echo "esbuild requested version:"
          node -p "require('./package.json').devDependencies.esbuild"
          npm install --no-audit --no-fund
          npm ls esbuild vite
          npm run build

      - name: Convert to Android with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "SMS Forwarder" "com.ssf.forwarder" --web-dir=dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Inject SociaxSmsBridge Native Plugin & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          JAVA_DIR="android/app/src/main/java/com/ssf/forwarder"
          mkdir -p "$JAVA_DIR"

          if [ -d "native-android" ]; then
            cp -f native-android/*.java "$JAVA_DIR/" 2>/dev/null || true
            if [ -f "native-android/AndroidManifest.xml" ]; then
              cp -f native-android/AndroidManifest.xml "$MANIFEST"
            fi
          fi

          if ! grep -q "android.permission.RECEIVE_SMS" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />|' "$MANIFEST"
          fi

          if ! grep -q "SmsReceiver" "$MANIFEST"; then
            sed -i 's|</application>|    <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">\n            <intent-filter android:priority="999">\n                <action android:name="android.provider.Telephony.SMS_RECEIVED" />\n            </intent-filter>\n        </receiver>\n        <receiver android:name=".BootReceiver" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n            </intent-filter>\n        </receiver>\n        <service android:name=".SmsForegroundService" android:enabled="true" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>|' "$MANIFEST"
          fi

          if [ ! -f "$JAVA_DIR/SociaxSmsBridgePlugin.java" ]; then
            cat << 'EOF' > "$JAVA_DIR/SociaxSmsBridgePlugin.java"
          package com.ssf.forwarder;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.List;

          @CapacitorPlugin(
              name = "SociaxSmsBridge",
              permissions = {
                  @Permission(strings = { Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS, Manifest.permission.READ_PHONE_STATE }, alias = "sms")
              }
          )
          public class SociaxSmsBridgePlugin extends Plugin {
              private static SociaxSmsBridgePlugin activeInstance;

              @Override
              public void load() {
                  activeInstance = this;
              }

              public static void emitIncomingSms(JSObject payload) {
                  if (activeInstance != null) {
                      activeInstance.notifyListeners("smsReceived", payload, true);
                  }
              }

              @PluginMethod
              public void getSimCards(PluginCall call) {
                  JSArray sims = new JSArray();
                  Context ctx = getContext();
                  boolean added = false;
                  if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED) {
                      SubscriptionManager sm = (SubscriptionManager) ctx.getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);
                      if (sm != null) {
                          List<SubscriptionInfo> list = sm.getActiveSubscriptionInfoList();
                          if (list != null) {
                              for (SubscriptionInfo info : list) {
                                  JSObject sim = new JSObject();
                                  int slot = info.getSimSlotIndex();
                                  sim.put("slotIndex", slot == 1 ? 1 : 0);
                                  sim.put("slotLabel", slot == 1 ? "SIM 2" : "SIM 1");
                                  sim.put("carrierName", info.getCarrierName() != null ? info.getCarrierName().toString() : "Active SIM");
                                  sim.put("isoCountryCode", info.getCountryIso() != null ? info.getCountryIso().toUpperCase() : "BD");
                                  sim.put("active", true);
                                  sims.put(sim);
                                  added = true;
                              }
                          }
                      }
                  }
                  if (!added) {
                      JSObject s1 = new JSObject();
                      s1.put("slotIndex", 0);
                      s1.put("slotLabel", "SIM 1");
                      s1.put("carrierName", "SIM 1");
                      s1.put("isoCountryCode", "BD");
                      s1.put("active", true);
                      sims.put(s1);
                  }
                  JSObject ret = new JSObject();
                  ret.put("sims", sims);
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestSmsPermissions(PluginCall call) {
                  if (getPermissionState("sms") != PermissionState.GRANTED) {
                      requestPermissionForAlias("sms", call, "smsPermsCallback");
                  } else {
                      resolvePermissions(call);
                  }
              }

              @PermissionCallback
              private void smsPermsCallback(PluginCall call) {
                  resolvePermissions(call);
              }

              private void resolvePermissions(PluginCall call) {
                  Context ctx = getContext();
                  JSObject ret = new JSObject();
                  ret.put("receiveSms", ContextCompat.checkSelfPermission(ctx, Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED);
                  ret.put("readSms", ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED);
                  ret.put("readPhoneState", ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED);
                  call.resolve(ret);
              }

              @PluginMethod
              public void checkBatteryOptimization(PluginCall call) {
                  call.resolve(buildBatteryResult());
              }

              @PluginMethod
              public void requestBatteryOptimizationBypass(PluginCall call) {
                  Context ctx = getContext();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) ctx.getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(ctx.getPackageName())) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + ctx.getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      }
                  }
                  call.resolve(buildBatteryResult());
              }

              private JSObject buildBatteryResult() {
                  Context ctx = getContext();
                  boolean ignoring = true;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) ctx.getSystemService(Context.POWER_SERVICE);
                      ignoring = pm != null && pm.isIgnoringBatteryOptimizations(ctx.getPackageName());
                  }
                  IntentFilter ifilter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                  Intent batteryStatus = ctx.registerReceiver(null, ifilter);
                  int level = 100;
                  if (batteryStatus != null) {
                      int rawLevel = batteryStatus.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int scale = batteryStatus.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                      if (rawLevel >= 0 && scale > 0) {
                          level = (int) ((rawLevel / (float) scale) * 100);
                      }
                  }
                  JSObject ret = new JSObject();
                  ret.put("ignoringBatteryOptimizations", ignoring);
                  ret.put("batteryLevel", level);
                  return ret;
              }

              @PluginMethod
              public void checkBootAutoStart(PluginCall call) {
                  SharedPreferences prefs = getContext().getSharedPreferences("ssf_prefs", Context.MODE_PRIVATE);
                  JSObject ret = new JSObject();
                  ret.put("enabled", prefs.getBoolean("boot_auto_start", true));
                  call.resolve(ret);
              }

              @PluginMethod
              public void setBootAutoStart(PluginCall call) {
                  boolean enabled = call.getBoolean("enabled", true);
                  SharedPreferences prefs = getContext().getSharedPreferences("ssf_prefs", Context.MODE_PRIVATE);
                  prefs.edit().putBoolean("boot_auto_start", enabled).apply();
                  JSObject ret = new JSObject();
                  ret.put("enabled", enabled);
                  call.resolve(ret);
              }

              @PluginMethod
              public void startForegroundService(PluginCall call) {
                  Context ctx = getContext();
                  Intent serviceIntent = new Intent(ctx, SmsForegroundService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      ctx.startForegroundService(serviceIntent);
                  } else {
                      ctx.startService(serviceIntent);
                  }
                  JSObject ret = new JSObject();
                  ret.put("running", true);
                  ret.put("channelId", "ssf_foreground_relay");
                  call.resolve(ret);
              }

              @PluginMethod
              public void stopForegroundService(PluginCall call) {
                  Context ctx = getContext();
                  ctx.stopService(new Intent(ctx, SmsForegroundService.class));
                  JSObject ret = new JSObject();
                  ret.put("running", false);
                  ret.put("channelId", "ssf_foreground_relay");
                  call.resolve(ret);
              }
          }
          EOF
          fi

          if [ ! -f "$JAVA_DIR/SmsReceiver.java" ]; then
            cat << 'EOF' > "$JAVA_DIR/SmsReceiver.java"
          package com.ssf.forwarder;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Telephony;
          import android.telephony.SmsMessage;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;
          import com.getcapacitor.JSObject;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;

          public class SmsReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Telephony.Sms.Intents.SMS_RECEIVED_ACTION.equals(intent.getAction())) {
                      SmsMessage[] messages = Telephony.Sms.Intents.getMessagesFromIntent(intent);
                      if (messages != null && messages.length > 0) {
                          StringBuilder fullMessage = new StringBuilder();
                          String sender = messages[0].getDisplayOriginatingAddress();
                          for (SmsMessage sms : messages) {
                              fullMessage.append(sms.getMessageBody());
                          }

                          Bundle extras = intent.getExtras();
                          int subId = extras != null ? extras.getInt("subscription", -1) : -1;
                          String simLabel = "SIM 1";
                          try {
                              SubscriptionManager sm = (SubscriptionManager) context.getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);
                              if (sm != null && subId != -1) {
                                  SubscriptionInfo info = sm.getActiveSubscriptionInfo(subId);
                                  if (info != null && info.getSimSlotIndex() == 1) {
                                      simLabel = "SIM 2";
                                  }
                              }
                          } catch (SecurityException ignored) {}

                          SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US);
                          sdf.setTimeZone(TimeZone.getTimeZone("UTC"));

                          JSObject payload = new JSObject();
                          payload.put("sender", sender != null ? sender : "Unknown");
                          payload.put("message", fullMessage.toString());
                          payload.put("simSlot", simLabel);
                          payload.put("receivedAt", sdf.format(new Date()));
                          if (subId != -1) {
                              payload.put("subscriptionId", subId);
                          }

                          SociaxSmsBridgePlugin.emitIncomingSms(payload);
                      }
                  }
              }
          }
          EOF
          fi

          if [ ! -f "$JAVA_DIR/SmsForegroundService.java" ]; then
            cat << 'EOF' > "$JAVA_DIR/SmsForegroundService.java"
          package com.ssf.forwarder;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class SmsForegroundService extends Service {
              public static final String CHANNEL_ID = "ssf_foreground_relay";

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "SMS Relay Service", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("SMS Forwarder Active")
                      .setContentText("Listening for incoming SMS messages...")
                      .setSmallIcon(android.R.drawable.ic_dialog_email)
                      .build();
                  startForeground(1001, notification);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF
          fi

          if [ ! -f "$JAVA_DIR/BootReceiver.java" ]; then
            cat << 'EOF' > "$JAVA_DIR/BootReceiver.java"
          package com.ssf.forwarder;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      SharedPreferences prefs = context.getSharedPreferences("ssf_prefs", Context.MODE_PRIVATE);
                      if (prefs.getBoolean("boot_auto_start", true)) {
                          Intent serviceIntent = new Intent(context, SmsForegroundService.class);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(serviceIntent);
                          } else {
                              context.startService(serviceIntent);
                          }
                      }
                  }
              }
          }
          EOF
          fi

          cat << 'EOF' > "$JAVA_DIR/MainActivity.java"
          package com.ssf.forwarder;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SociaxSmsBridgePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sociax-sms-forwarder-full
          path: android/app/build/outputs/apk/debug/app-debug.apk
