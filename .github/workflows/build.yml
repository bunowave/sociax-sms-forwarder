name: Build Full Sociax SMS Forwarder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          ZIP_FILE="sociax-sms-forwarder-multi-endpoint-update.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Upload the SOCIAX project ZIP to the repository root."
            exit 1
          fi
          rm -rf .project-extract
          mkdir -p .project-extract
          unzip -oq "$ZIP_FILE" -d .project-extract
          PROJECT_DIR=$(find .project-extract -type f -name "package.json" -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside $ZIP_FILE"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .
          rm -rf .project-extract .aistudio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fix dependencies, install & build web app
        run: |
          test -f package.json
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.devDependencies = p.devDependencies || {}; if (p.dependencies) delete p.dependencies.esbuild; p.devDependencies.esbuild = "^0.28.2"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
          rm -f package-lock.json
          rm -rf node_modules
          echo "esbuild requested version:"
          node -p "require('./package.json').devDependencies.esbuild"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm ls esbuild vite
          npm run build

      - name: Convert to Android with Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "SMS Forwarder" "com.ssf.forwarder" --web-dir=dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Inject SociaxSmsBridge Native Plugin & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          JAVA_DIR="android/app/src/main/java/com/ssf/forwarder"
          mkdir -p "$JAVA_DIR"

          if [ -d "native-android" ]; then
            cp -f native-android/*.java "$JAVA_DIR/" 2>/dev/null || true
            if [ -f "native-android/AndroidManifest.xml" ]; then
              cp -f native-android/AndroidManifest.xml "$MANIFEST"
            fi
          fi

          if ! grep -q "android.permission.RECEIVE_SMS" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />|' "$MANIFEST"
          fi

          if ! grep -q "SmsReceiver" "$MANIFEST"; then
            sed -i 's|</application>|    <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">\n            <intent-filter android:priority="999">\n                <action android:name="android.provider.Telephony.SMS_RECEIVED" />\n            </intent-filter>\n        </receiver>\n        <receiver android:name=".BootReceiver" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n            </intent-filter>\n        </receiver>\n        <service android:name=".SmsForegroundService" android:enabled="true" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>|' "$MANIFEST"
          fi

          if [ ! -f "$JAVA_DIR/SociaxSmsBridgePlugin.java" ]; then
            cat << 'EOF' > "$JAVA_DIR/SociaxSmsBridgePlugin.java"
          package com.ssf.forwarder;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
