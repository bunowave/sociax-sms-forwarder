name: Build Full Sociax SMS Forwarder APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract SOCIAX project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" ! -name "node_modules.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p .project-extract

          unzip -oq "$ZIP_FILE" -d .project-extract \
            -x "node_modules/*" "*/node_modules/*" ".aistudio/*" "*/.aistudio/*"

          PACKAGE_DIR=$(find .project-extract -type f -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)

          if [ -z "$PACKAGE_DIR" ]; then
            echo "ERROR: package.json not found inside ZIP!"
            exit 1
          fi

          cp -a "$PACKAGE_DIR"/. .
          rm -rf .project-extract .aistudio

          test -f package.json

          echo "Project extracted successfully."
          ls -la

      - name: Fix dependencies and build web app
        shell: bash
        run: |
          set -e

          node -e '
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));

          p.devDependencies = p.devDependencies || {};

          if (p.dependencies) {
            delete p.dependencies.esbuild;
          }

          p.devDependencies.esbuild = "^0.28.2";

          fs.writeFileSync(
            "package.json",
            JSON.stringify(p, null, 2) + "\n"
          );
          '

          rm -f package-lock.json
          rm -rf node_modules

          npm install --no-audit --no-fund --legacy-peer-deps

          npm ls esbuild vite

          npm run build

          test -d dist

      - name: Install Capacitor
        shell: bash
        run: |
          set -e

          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund --legacy-peer-deps

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "SOCIAX SMS Forwarder" "com.ssf.forwarder" --web-dir=dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android Native SMS
        shell: bash
        run: |
          set -e

          APP_ID="com.ssf.forwarder"
          JAVA_DIR="android/app/src/main/java/com/ssf/forwarder"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          mkdir -p "$JAVA_DIR"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECEIVE_SMS",
              "android.permission.READ_SMS",
              "android.permission.READ_PHONE_STATE",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
          ]

          existing = {
              item.get(android + "name")
              for item in root.findall("uses-permission")
          }

          for permission in permissions:
              if permission not in existing:
                  ET.SubElement(
                      root,
                      "uses-permission",
                      {android + "name": permission}
                  )

          application = root.find("application")

          if application is None:
              raise RuntimeError("Android application element not found")

          components = [
              {
                  "tag": "receiver",
                  "name": ".SmsReceiver",
                  "exported": "true",
                  "permission": "android.permission.BROADCAST_SMS",
                  "filter": "android.provider.Telephony.SMS_RECEIVED"
              },
              {
                  "tag": "receiver",
                  "name": ".BootReceiver",
                  "exported": "true",
                  "permission": None,
                  "filter": "android.intent.action.BOOT_COMPLETED"
              },
              {
                  "tag": "service",
                  "name": ".SmsForegroundService",
                  "exported": "false",
                  "permission": None,
                  "filter": None
              }
          ]

          for component in components:
              name = component["name"]

              found = any(
                  element.get(android + "name") == name
                  for element in application
              )

              if found:
                  continue

              element = ET.SubElement(
                  application,
                  component["tag"]
              )

              element.set(android + "name", name)
              element.set(
                  android + "exported",
                  component["exported"]
              )

              if component["permission"]:
                  element.set(
                      android + "permission",
                      component["permission"]
                  )

              if component["tag"] == "service":
                  element.set(
                      android + "foregroundServiceType",
                      "dataSync"
                  )
              else:
                  intent = ET.SubElement(element, "intent-filter")

                  if component["filter"].endswith("SMS_RECEIVED"):
                      intent.set(android + "priority", "999")

                  ET.SubElement(
                      intent,
                      "action",
                      {android + "name": component["filter"]}
                  )

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)

          print("Android Manifest configured.")
          PY

          cat > "$JAVA_DIR/SociaxSmsBridgePlugin.java" <<'EOF'
          package com.ssf.forwarder;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;

          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.util.List;

          @CapacitorPlugin(
              name = "SociaxSmsBridge",
              permissions = {
                  @Permission(
                      strings = {
                          Manifest.permission.RECEIVE_SMS,
                          Manifest.permission.READ_SMS,
                          Manifest.permission.READ_PHONE_STATE
                      },
                      alias = "sms"
                  )
              }
          )
          public class SociaxSmsBridgePlugin extends Plugin {

              private static SociaxSmsBridgePlugin activeInstance;

              @Override
              public void load() {
                  activeInstance = this;
              }

              public static void emitIncomingSms(JSObject payload) {
                  if (activeInstance != null) {
                      activeInstance.notifyListeners(
                          "smsReceived",
                          payload,
                          true
                      );
                  }
              }

              @PluginMethod
              public void getSimCards(PluginCall call) {
                  JSArray sims = new JSArray();
                  Context ctx = getContext();

                  if (ContextCompat.checkSelfPermission(
                      ctx,
                      Manifest.permission.READ_PHONE_STATE
                  ) == PackageManager.PERMISSION_GRANTED) {

                      SubscriptionManager sm =
                          (SubscriptionManager) ctx.getSystemService(
                              Context.TELEPHONY_SUBSCRIPTION_SERVICE
                          );

                      if (sm != null) {
                          List<SubscriptionInfo> list =
                              sm.getActiveSubscriptionInfoList();

                          if (list != null) {
                              for (SubscriptionInfo info : list) {
                                  int slot = info.getSimSlotIndex();

                                  JSObject sim = new JSObject();
                                  sim.put("slotIndex", slot == 1 ? 1 : 0);
                                  sim.put("slotLabel", slot == 1 ? "SIM 2" : "SIM 1");
                                  sim.put("carrierName", info.getCarrierName() != null ? info.getCarrierName().toString() : "Active SIM");
                                  sim.put("isoCountryCode", info.getCountryIso() != null ? info.getCountryIso().toUpperCase() : "BD");
                                  sim.put("active", true);

                                  sims.put(sim);
                              }
                          }
                      }
                  }

                  if (sims.length() == 0) {
                      JSObject sim = new JSObject();
                      sim.put("slotIndex", 0);
                      sim.put("slotLabel", "SIM 1");
                      sim.put("carrierName", "SIM 1");
                      sim.put("isoCountryCode", "BD");
                      sim.put("active", true);
                      sims.put(sim);
                  }

                  JSObject result = new JSObject();
                  result.put("sims", sims);
                  call.resolve(result);
              }

              @PluginMethod
              public void requestSmsPermissions(PluginCall call) {
                  if (getPermissionState("sms") != PermissionState.GRANTED) {
                      requestPermissionForAlias("sms", call, "smsPermsCallback");
                  } else {
                      resolvePermissions(call);
                  }
              }

              @PermissionCallback
              private void smsPermsCallback(PluginCall call) {
                  resolvePermissions(call);
              }

              private void resolvePermissions(PluginCall call) {
                  Context ctx = getContext();

                  JSObject result = new JSObject();
                  result.put("receiveSms", ContextCompat.checkSelfPermission(ctx, Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED);
                  result.put("readSms", ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED);
                  result.put("readPhoneState", ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED);

                  call.resolve(result);
              }

              @PluginMethod
              public void checkBatteryOptimization(PluginCall call) {
                  call.resolve(buildBatteryResult());
              }

              @PluginMethod
              public void requestBatteryOptimizationBypass(PluginCall call) {
                  Context ctx = getContext();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm =
                          (PowerManager) ctx.getSystemService(Context.POWER_SERVICE);

                      if (pm != null && !pm.isIgnoringBatteryOptimizations(ctx.getPackageName())) {
                          Intent intent = new Intent(
                              Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
                          );

                          intent.setData(Uri.parse("package:" + ctx.getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      }
                  }

                  call.resolve(buildBatteryResult());
              }

              private JSObject buildBatteryResult() {
                  Context ctx = getContext();

                  boolean ignoring = true;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm =
                          (PowerManager) ctx.getSystemService(Context.POWER_SERVICE);

                      ignoring = pm != null &&
                          pm.isIgnoringBatteryOptimizations(ctx.getPackageName());
                  }

                  IntentFilter filter =
                      new IntentFilter(Intent.ACTION_BATTERY_CHANGED);

                  Intent battery = ctx.registerReceiver(null, filter);

                  int level = 100;

                  if (battery != null) {
                      int raw = battery.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int scale = battery.getIntExtra(BatteryManager.EXTRA_SCALE, -1);

                      if (raw >= 0 && scale > 0) {
                          level = (int) ((raw / (float) scale) * 100);
                      }
                  }

                  JSObject result = new JSObject();
                  result.put("ignoringBatteryOptimizations", ignoring);
                  result.put("batteryLevel", level);

                  return result;
              }

              @PluginMethod
              public void checkBootAutoStart(PluginCall call) {
                  SharedPreferences prefs = getContext().getSharedPreferences(
                      "ssf_prefs",
                      Context.MODE_PRIVATE
                  );

                  JSObject result = new JSObject();
                  result.put("enabled", prefs.getBoolean("boot_auto_start", true));

                  call.resolve(result);
              }

              @PluginMethod
              public void setBootAutoStart(PluginCall call) {
                  boolean enabled = call.getBoolean("enabled", true);

                  SharedPreferences prefs = getContext().getSharedPreferences(
                      "ssf_prefs",
                      Context.MODE_PRIVATE
                  );

                  prefs.edit().putBoolean("boot_auto_start", enabled).apply();

                  JSObject result = new JSObject();
                  result.put("enabled", enabled);

                  call.resolve(result);
              }

              @PluginMethod
              public void startForegroundService(PluginCall call) {
                  Context ctx = getContext();

                  Intent intent = new Intent(
                      ctx,
                      SmsForegroundService.class
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      ctx.startForegroundService(intent);
                  } else {
                      ctx.startService(intent);
                  }

                  JSObject result = new JSObject();
                  result.put("running", true);
                  result.put("channelId", "ssf_foreground_relay");

                  call.resolve(result);
              }

              @PluginMethod
              public void stopForegroundService(PluginCall call) {
                  Context ctx = getContext();

                  ctx.stopService(
                      new Intent(ctx, SmsForegroundService.class)
                  );

                  JSObject result = new JSObject();
                  result.put("running", false);
                  result.put("channelId", "ssf_foreground_relay");

                  call.resolve(result);
              }
          }
          EOF

          cat > "$JAVA_DIR/SmsReceiver.java" <<'EOF'
          package com.ssf.forwarder;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Telephony;
          import android.telephony.SmsMessage;
          import android.telephony.SubscriptionInfo;
          import android.telephony.SubscriptionManager;

          import com.getcapacitor.JSObject;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;

          public class SmsReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (!Telephony.Sms.Intents.SMS_RECEIVED_ACTION.equals(intent.getAction())) {
                      return;
                  }

                  SmsMessage[] messages =
                      Telephony.Sms.Intents.getMessagesFromIntent(intent);

                  if (messages == null || messages.length == 0) {
                      return;
                  }

                  StringBuilder body = new StringBuilder();

                  String sender =
                      messages[0].getDisplayOriginatingAddress();

                  for (SmsMessage sms : messages) {
                      body.append(sms.getMessageBody());
                  }

                  Bundle extras = intent.getExtras();

                  int subId = extras != null
                      ? extras.getInt("subscription", -1)
                      : -1;

                  String simLabel = "SIM 1";

                  try {
                      SubscriptionManager manager =
                          (SubscriptionManager) context.getSystemService(
                              Context.TELEPHONY_SUBSCRIPTION_SERVICE
                          );

                      if (manager != null && subId != -1) {
                          SubscriptionInfo info =
                              manager.getActiveSubscriptionInfo(subId);

                          if (info != null && info.getSimSlotIndex() == 1) {
                              simLabel = "SIM 2";
                          }
                      }
                  } catch (SecurityException ignored) {
                  }

                  SimpleDateFormat format = new SimpleDateFormat(
                      "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'",
                      Locale.US
                  );

                  format.setTimeZone(TimeZone.getTimeZone("UTC"));

                  JSObject payload = new JSObject();

                  payload.put("sender", sender != null ? sender : "Unknown");
                  payload.put("message", body.toString());
                  payload.put("simSlot", simLabel);
                  payload.put("receivedAt", format.format(new Date()));

                  if (subId != -1) {
                      payload.put("subscriptionId", subId);
                  }

                  SociaxSmsBridgePlugin.emitIncomingSms(payload);
              }
          }
          EOF

          cat > "$JAVA_DIR/SmsForegroundService.java" <<'EOF'
          package com.ssf.forwarder;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          import androidx.core.app.NotificationCompat;

          public class SmsForegroundService extends Service {

              public static final String CHANNEL_ID = "ssf_foreground_relay";

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "SMS Relay Service",
                          NotificationManager.IMPORTANCE_LOW
                      );

                      NotificationManager manager =
                          getSystemService(NotificationManager.class);

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }

                  Notification notification =
                      new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("SOCIAX SMS Forwarder")
                          .setContentText("SMS monitoring service is active")
                          .setSmallIcon(android.R.drawable.ic_dialog_email)
                          .setOngoing(true)
                          .build();

                  startForeground(1001, notification);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > "$JAVA_DIR/BootReceiver.java" <<'EOF'
          package com.ssf.forwarder;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      return;
                  }

                  SharedPreferences prefs =
                      context.getSharedPreferences(
                          "ssf_prefs",
                          Context.MODE_PRIVATE
                      );

                  if (!prefs.getBoolean("boot_auto_start", true)) {
                      return;
                  }

                  Intent serviceIntent =
                      new Intent(context, SmsForegroundService.class);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent);
                  } else {
                      context.startService(serviceIntent);
                  }
              }
          }
          EOF

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package com.ssf.forwarder;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SociaxSmsBridgePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          echo "Native Android files created."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sociax-sms-forwarder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
