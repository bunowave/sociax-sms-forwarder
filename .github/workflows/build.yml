      - name: Extract SOCIAX project
        shell: bash
        run: |
          set -e

          ZIP_FILE="sociax-sms-forwarder-multi-endpoint-update.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Updated SOCIAX project ZIP not found!"
            echo "Please upload $ZIP_FILE to repository root."
            exit 1
          fi

          mkdir -p .project-extract

          unzip -oq "$ZIP_FILE" -d .project-extract \
            -x "node_modules/*" "*/node_modules/*" ".aistudio/*" "*/.aistudio/*"

          PACKAGE_DIR=$(find .project-extract \
            -type f \
            -name package.json \
            -not -path "*/node_modules/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PACKAGE_DIR" ]; then
            echo "ERROR: package.json not found inside ZIP!"
            exit 1
          fi

          cp -a "$PACKAGE_DIR"/. .

          rm -rf .project-extract .aistudio

          test -f package.json

          echo "Updated SOCIAX project extracted successfully."
          ls -la
